[project]
name = "agentic-ai-cybersecurity"
version = "0.1.0"
description = "Autonomous AI SOC Platform — multi-agent cybersecurity detection and response"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Data & ML — versions with Python 3.13 wheels
    "pandas>=2.2",
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "joblib>=1.4",
    # Vector search & embeddings
    "faiss-cpu>=1.8",
    "sentence-transformers>=3.0",
    # LLM / Agent orchestration
    "langgraph>=0.2",
    "langchain-openai>=0.2",
    "langchain-google-genai>=2.0",
    "langchain-core>=0.3",
    "openai>=1.50",
    # Config & env
    "python-dotenv>=1.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    # Web / API
    "requests>=2.32",
    "aiohttp>=3.10",
    # Dashboard & visualization
    "streamlit>=1.40",
    "plotly>=5.24",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    # Networking
    "scapy>=2.6",
    # Caching (optional at runtime — gracefully skipped if not configured)
    "redis>=5.2",
    # Streaming (optional at runtime)
    "kafka-python-ng>=2.2",
    # Utilities
    "colorama>=0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]
api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
soc-dashboard = "src.dashboard.live_dashboard:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "config"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
