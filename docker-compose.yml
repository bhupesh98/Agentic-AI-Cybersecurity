# ─────────────────────────────────────────────────────────────────────────────
# Agentic AI SOC Platform — docker-compose.yml
#
# Quick start:
#   cp .env.example .env         # fill in API keys
#   docker compose up -d redis
#   docker compose up -d
#
# Dashboard → http://localhost:8501
# API       → http://localhost:8000/docs
# ─────────────────────────────────────────────────────────────────────────────

version: "3.9"

x-base: &base
  build: .
  env_file: .env
  restart: unless-stopped
  volumes:
    - ./data:/app/data
    - ./models:/app/models

services:

  # ── Infrastructure ────────────────────────────────────────────────────────

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181"]
      interval: 15s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 20s
      timeout: 10s
      retries: 10

  # ── Application services ──────────────────────────────────────────────────

  orchestrator:
    <<: *base
    environment:
      SERVICE_TYPE: orchestrator
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      redis:
        condition: service_healthy
    profiles:
      - full

  dashboard:
    <<: *base
    environment:
      SERVICE_TYPE: dashboard
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8501:8501"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  api:
    <<: *base
    environment:
      SERVICE_TYPE: api
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  ml-detection:
    <<: *base
    environment:
      SERVICE_TYPE: ml-detection
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    profiles:
      - full

  llm-reasoning:
    <<: *base
    environment:
      SERVICE_TYPE: llm-reasoning
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - full

  memory:
    <<: *base
    environment:
      SERVICE_TYPE: memory
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    profiles:
      - full

  response:
    <<: *base
    environment:
      SERVICE_TYPE: response
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - full

volumes:
  redis_data:
