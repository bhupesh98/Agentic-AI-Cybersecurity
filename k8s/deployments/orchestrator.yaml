apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: soc-platform
  labels:
    app: orchestrator
    component: agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata:
      labels:
        app: orchestrator
        component: agent
    spec:
      containers:
        - name: orchestrator
          image: agentic-ai-soc:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: SERVICE_TYPE
              value: orchestrator
          envFrom:
            - configMapRef:
                name: soc-config
            - secretRef:
                name: soc-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: models
              mountPath: /app/models
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: soc-data-pvc
        - name: models
          persistentVolumeClaim:
            claimName: soc-models-pvc
