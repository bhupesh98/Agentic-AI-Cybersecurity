apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: soc-platform
  labels:
    app: api
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
        component: backend
    spec:
      containers:
        - name: api
          image: agentic-ai-soc:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: SERVICE_TYPE
              value: api
          envFrom:
            - configMapRef:
                name: soc-config
            - secretRef:
                name: soc-secrets
          ports:
            - name: http
              containerPort: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 5
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: soc-data-pvc
