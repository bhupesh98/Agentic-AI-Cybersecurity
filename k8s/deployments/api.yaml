# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.34.5/deployment.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: soc-platform
  labels:
    app: api
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
        component: backend
    spec:
      containers:
        - name: api
          image: localhost/agentic-ai-soc:latest
          imagePullPolicy: IfNotPresent
          command: ["/app/.venv/bin/python"]
          args:
            - "-m"
            - "uvicorn"
            - "src.api.app:app"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8000"
          env:
            - name: SERVICE_TYPE
              value: api
            - name: NVIDIA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: soc-secrets
                  key: NVIDIA_API_KEY
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: soc-secrets
                  key: GEMINI_API_KEY
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: soc-secrets
                  key: OPENAI_API_KEY
            - name: ABUSEIPDB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: soc-secrets
                  key: ABUSEIPDB_API_KEY
            - name: VIRUSTOTAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: soc-secrets
                  key: VIRUSTOTAL_API_KEY
            - name: SHODAN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: soc-secrets
                  key: SHODAN_API_KEY
            - name: SMTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: soc-secrets
                  key: SMTP_USERNAME
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: soc-secrets
                  key: SMTP_PASSWORD
            - name: SMTP_FROM
              valueFrom:
                secretKeyRef:
                  name: soc-secrets
                  key: SMTP_FROM
            - name: SLACK_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: soc-secrets
                  key: SLACK_WEBHOOK_URL
          envFrom:
            - configMapRef:
                name: soc-config
          ports:
            - name: http
              containerPort: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 5
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: soc-data-pvc
