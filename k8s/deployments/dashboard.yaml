# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.34.5/deployment.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: soc-platform
  labels:
    app: dashboard
    component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
        component: frontend
    spec:
      containers:
        - name: dashboard
          image: localhost/agentic-ai-soc:local
          imagePullPolicy: IfNotPresent
          env:
            - name: SERVICE_TYPE
              value: dashboard
            - name: NVIDIA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: soc-secrets
                  key: NVIDIA_API_KEY
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: soc-secrets
                  key: GEMINI_API_KEY
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: soc-secrets
                  key: OPENAI_API_KEY
            - name: ABUSEIPDB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: soc-secrets
                  key: ABUSEIPDB_API_KEY
            - name: VIRUSTOTAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: soc-secrets
                  key: VIRUSTOTAL_API_KEY
            - name: SHODAN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: soc-secrets
                  key: SHODAN_API_KEY
            - name: SMTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: soc-secrets
                  key: SMTP_USERNAME
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: soc-secrets
                  key: SMTP_PASSWORD
            - name: SMTP_FROM
              valueFrom:
                secretKeyRef:
                  name: soc-secrets
                  key: SMTP_FROM
            - name: SLACK_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: soc-secrets
                  key: SLACK_WEBHOOK_URL
          envFrom:
            - configMapRef:
                name: soc-config
          ports:
            - name: streamlit
              containerPort: 8501
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: soc-data-pvc
