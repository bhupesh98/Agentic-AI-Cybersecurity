 # yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.34.5/configmap-v1.json
apiVersion: v1
kind: ConfigMap
metadata:
  name: soc-config
  namespace: soc-platform
data:
  LOG_LEVEL: "INFO"
  SIMULATION_MODE: "true"
  ENABLE_METRICS: "true"
  LLM_PROVIDER: "auto"
  NVIDIA_BASE_URL: "https://integrate.api.nvidia.com/v1"
  NVIDIA_MODEL: "minimaxai/minimax-m2.7"
  GEMINI_MODEL: "gemini-flash-latest"
  OPENAI_MODEL: "gpt-4o-mini"
  LLM_TEMPERATURE: "0.1"
  LLM_MAX_FLOWS_PER_BATCH: "10"
  BUDGET_TOKENS_PER_MINUTE: "50000"
  BUDGET_MAX_LLM_CALLS_PER_MINUTE: "20"
  SMTP_SERVER: "smtp-relay.brevo.com"
  SMTP_PORT: "587"
  REDIS_URL: "redis://redis:6379/0"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  DB_PATH: "/app/data/incidents.db"
