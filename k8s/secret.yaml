# Create this secret with real values — do NOT commit real keys to source control.
# Generate the base64 values with:  echo -n "YOUR_KEY" | base64
#
# Or create it imperatively:
#   kubectl -n soc-platform create secret generic soc-secrets \
#     --from-literal=NVIDIA_API_KEY=... \
#     --from-literal=GEMINI_API_KEY=...  \
#     etc.

# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.34.5/secret.json
apiVersion: v1
kind: Secret
metadata:
  name: soc-secrets
  namespace: soc-platform
type: Opaque
stringData:
  NVIDIA_API_KEY: ""
  GEMINI_API_KEY: ""
  OPENAI_API_KEY: ""
  ABUSEIPDB_API_KEY: ""
  VIRUSTOTAL_API_KEY: ""
  SHODAN_API_KEY: ""
  SMTP_USERNAME: ""
  SMTP_PASSWORD: ""
  SMTP_FROM: ""
  SLACK_WEBHOOK_URL: ""
